apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  labels:
    app: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: review-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: REVIEW_DB_URL
              value: "jdbc:mysql://review-db:3306/reviewdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: REVIEW_DB_USERNAME
              value: "root"
            - name: REVIEW_DB_PASSWORD
              value: "reviewpassword"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  labels:
    app: review-service
spec:
  selector:
    app: review-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
