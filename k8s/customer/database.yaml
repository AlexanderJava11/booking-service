apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: customer-db

  template:
    metadata:
      labels:
        app: customer-db

    spec:
      containers:
        - name: customer-db
          image: mysql:8.0

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-secret
                  key: db-password

            - name: MYSQL_DATABASE
              value: customerdb

          ports:
            - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: customer-db

spec:
  selector:
    app: customer-db

  ports:
    - port: 3306
      targetPort: 3306

  type: ClusterIP