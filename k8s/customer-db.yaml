apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db
  labels:
    app: customer-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-db
  template:
    metadata:
      labels:
        app: customer-db
    spec:
      containers:
        - name: customer-db
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "customerdb"
            - name: MYSQL_ROOT_PASSWORD
              value: "customerpassword"
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-pcustomerpassword"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-pcustomerpassword"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: customer-db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: customer-db-data
          persistentVolumeClaim:
            claimName: customer-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: customer-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-db
  labels:
    app: customer-db
spec:
  selector:
    app: customer-db
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
