apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: CUSTOMER_DB_URL
              value: "jdbc:mysql://customer-db:3306/customerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: CUSTOMER_DB_USERNAME
              value: "root"
            - name: CUSTOMER_DB_PASSWORD
              value: "customerpassword"
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8080"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
